<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="2;url=https://drive.google.com/drive/folders/1Vjb2BQRYBAiDgKCLd5MaYRozV3zVU0uz">

    <title>Redirecionando...</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            text-align: center;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        .loader {
            width: 35px;
            height: 35px;
            margin: 0 auto 20px;
            border: 4px solid #ddd;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: girar 1s linear infinite;
        }

        a {
            color: #4285f4;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="loader"></div>

        <h1>Redirecionando...</h1>

        <p>
            Você será direcionado para o Google Drive.
        </p>

        <a href="https://drive.google.com/drive/folders/1Vjb2BQRYBAiDgKCLd5MaYRozV3zVU0uz">
            Clique aqui se não for redirecionado
        </a>
    </div>

    <script>
        setTimeout(function () {
            window.location.href =
                "https://drive.google.com/drive/folders/1Vjb2BQRYBAiDgKCLd5MaYRozV3zVU0uz";
        }, 2000);
    </script>

</body>
</html>
