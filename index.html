<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="9º Encontro de Jovens com Cristo da Paróquia Nossa Senhora Aparecida do Cocaia. Uma experiência de fé, união e espiritualidade.">
    <meta name="theme-color" content="#000000">
    
    <!-- Open Graph -->
    <meta property="og:title" content="9º Encontro de Jovens com Cristo | Paróquia Nossa Senhora Aparecida do Cocaia">
    <meta property="og:description" content="Uma experiência de fé, união e espiritualidade. Prepare-se para um grande encontro.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/logo.png">
    
    <title>9º Encontro de Jovens com Cristo | Paróquia Nossa Senhora Aparecida do Cocaia</title>
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./assets/logo.png">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite" aria-label="Carregando experiência">
        <div class="loading-content">
            <img id="loading-logo" src="./assets/logo.png" alt="Logo do 9º Encontro de Jovens com Cristo" class="loading-logo" loading="eager">
            <p class="loading-text">Preparando a experiência...</p>
            <div class="loading-indicator" aria-hidden="true">
                <div class="loading-bar"></div>
            </div>
        </div>
        
        <!-- Botão de entrada (aparece quando autoplay é bloqueado) -->
        <button id="enter-btn" class="enter-btn" type="button" aria-label="Entrar no site e iniciar experiência com áudio" style="display: none;">
            <span class="enter-btn-text">Entrar</span>
            <span class="enter-btn-icon" aria-hidden="true">→</span>
        </button>
    </div>

    <!-- Conteúdo Principal -->
    <main id="main-content" class="main-content" aria-hidden="true">
        <div class="content-wrapper">
            <!-- Logo -->
            <div class="logo-container">
                <img id="main-logo" src="./assets/logo.png" alt="Logo do 9º Encontro de Jovens com Cristo da Paróquia Nossa Senhora Aparecida do Cocaia" class="main-logo" loading="eager">
            </div>
            
            <!-- Nome do Evento -->
            <h1 class="event-title">
                <span class="event-title-line">9º Encontro de Jovens com Cristo</span>
                <span class="event-title-line">da Paróquia Nossa Senhora Aparecida do Cocaia</span>
            </h1>
            
            <!-- Contagem Regressiva -->
            <div id="countdown" class="countdown" role="timer" aria-label="Contagem regressiva para o evento">
                <div class="countdown-item">
                    <span id="days" class="countdown-number">00</span>
                    <span class="countdown-label">Dias</span>
                </div>
                <div class="countdown-item">
                    <span id="hours" class="countdown-number">00</span>
                    <span class="countdown-label">Horas</span>
                </div>
                <div class="countdown-item">
                    <span id="minutes" class="countdown-number">00</span>
                    <span class="countdown-label">Minutos</span>
                </div>
                <div class="countdown-item">
                    <span id="seconds" class="countdown-number">00</span>
                    <span class="countdown-label">Segundos</span>
                </div>
            </div>
            
            <!-- Mensagem quando o evento chegar -->
            <p id="event-message" class="event-message" style="display: none;" aria-live="polite">O grande momento chegou.</p>
        </div>
        
        <!-- Player de Música -->
        <div id="player" class="player" role="region" aria-label="Player de música">
            <div class="player-inner">
                <button id="play-btn" class="player-btn play-btn" type="button" aria-label="Tocar música" aria-pressed="false">
                    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                
                <div class="player-info">
                    <span id="music-title" class="music-title">NOME DA MÚSICA</span>
                    <span id="music-artist" class="music-artist">NOME DO CANTOR</span>
                </div>
                
                <div class="player-progress-wrapper">
                    <span id="current-time" class="time-display">0:00</span>
                    <div class="progress-bar-container" role="slider" aria-label="Progresso da música" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                        <div id="progress-bar" class="progress-bar" aria-hidden="true"></div>
                        <div id="progress-handle" class="progress-handle" aria-hidden="true"></div>
                    </div>
                    <span id="duration" class="time-display">0:00</span>
                </div>
                
                <button id="volume-btn" class="player-btn volume-btn" type="button" aria-label="Controle de volume" aria-pressed="false">
                    <svg class="icon-volume" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
                
                <div id="volume-slider" class="volume-slider" style="display: none;" role="slider" aria-label="Ajustar volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" tabindex="0">
                    <div id="volume-level" class="volume-level" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Elemento de áudio -->
    <audio id="audio-element" preload="metadata" crossorigin="anonymous"></audio>
    
    <script src="./js/script.js"></script>
</body>
</html>
