<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Livrão do 9º Encontro de Jovens com Cristo da Paróquia Nossa Senhora Aparecida do Cocaia.">
    <meta name="theme-color" content="#000000">

    <meta property="og:title" content="Livrão | 9º EJC Paróquia Nossa Senhora Aparecida do Cocaia">
    <meta property="og:description" content="Acesse o Livrão, a Música Tema e os materiais do encontro.">
    <meta property="og:type" content="website">

    <title>Livrão | 9º Encontro de Jovens com Cristo</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/agorasim.css">
</head>
<body>
    <!-- ==================== POPUP DE SIGILO ==================== -->
    <div id="sigilo-popup" class="sigilo-popup" role="dialog" aria-modal="true" aria-labelledby="sigilo-title">
        <div class="sigilo-popup-overlay"></div>
        <div class="sigilo-popup-content">
            <div class="sigilo-popup-header">
                <span class="sigilo-popup-icon" aria-hidden="true">🤫</span>
                <h2 id="sigilo-title" class="sigilo-popup-title"></h2>
            </div>
            <div class="sigilo-popup-body" id="sigilo-message"></div>
            <button id="sigilo-close-btn" class="sigilo-popup-btn" aria-label="Entendi, fechar aviso">
                <span>Entendi</span>
                <span aria-hidden="true">→</span>
            </button>
        </div>
    </div>

    <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
    <main class="agorasim-main">
        <!-- Logo -->
        <div class="logo-container">
            <img id="agorasim-logo" src="" alt="Logo do 9º Encontro de Jovens com Cristo" class="main-logo" loading="eager">
        </div>

        <h1 class="event-title">
            9º Encontro de Jovens com Cristo<br>
            <span class="event-subtitle">da Paróquia Nossa Senhora Aparecida do Cocaia</span>
        </h1>

        <!-- Música Tema -->
        <section class="agorasim-section">
            <h2 class="agorasim-section-title">
                <span aria-hidden="true">🎵</span> Música Tema
            </h2>
            <div class="agorasim-buttons">
                <a id="btn-youtube" href="#" target="_blank" rel="noopener noreferrer" class="agorasim-btn agorasim-btn--youtube">
                    <svg class="agorasim-btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <span>YouTube</span>
                </a>
                <a id="btn-spotify" href="#" target="_blank" rel="noopener noreferrer" class="agorasim-btn agorasim-btn--spotify">
                    <svg class="agorasim-btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>
                    <span>Spotify</span>
                </a>
            </div>
        </section>

        <!-- Livrão -->
        <section class="agorasim-section">
            <h2 class="agorasim-section-title">
                <span aria-hidden="true">📖</span> Livrão
            </h2>

            <!-- Visualizador de PDF -->
            <div class="pdf-viewer-wrapper">
                <iframe id="pdf-viewer" class="pdf-viewer" title="Visualizador do Livrão"></iframe>
                <div id="pdf-fallback" class="pdf-fallback hidden">
                    <p>Seu navegador não suporta visualização de PDF.</p>
                    <p>Use os botões abaixo para acessar o conteúdo.</p>
                </div>
            </div>

            <div class="agorasim-buttons agorasim-buttons--vertical">
                <a id="btn-download" href="#" download class="agorasim-btn agorasim-btn--download">
                    <svg class="agorasim-btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    <span>Baixar PDF</span>
                </a>
                <a id="btn-drive" href="#" target="_blank" rel="noopener noreferrer" class="agorasim-btn agorasim-btn--drive">
                    <svg class="agorasim-btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7.71 3.5L1.15 15l3.43 5.95L11.14 9.5 7.71 3.5zm8.58 0L9.57 19.5H20.3l3.43-5.95L16.29 3.5h.01z"/>
                    </svg>
                    <span>Acessar via Google Drive</span>
                </a>
            </div>
        </section>

        <!-- Voltar -->
        <a href="./index.html" class="agorasim-back-link">
            <span aria-hidden="true">←</span> Voltar para o início
        </a>
    </main>

    <script src="./js/agorasim.js"></script>
    <script src="./js/agorasim-page.js"></script>
</body>
</html>
